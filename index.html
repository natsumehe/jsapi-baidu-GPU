<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>洋山港四期 · 海量空间数据流式渲染</title>
    <style>
        :root {
            --panel: rgba(5, 18, 33, 0.90);
            --panel2: rgba(9, 28, 48, 0.92);
            --border: rgba(111, 185, 245, 0.34);
            --text: #eaf5ff;
            --muted: #91a9c4;
            --green: #39eb75;
            --orange: #ffae27;
            --blue: #2f8cff;
            --cyan: #66baff;
            --purple: #d15dec;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0b1220;
            color: var(--text);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }

        #map_container { width: 100%; height: 100%; position: relative; }

        .hud {
            position: absolute;
            z-index: 2147483646;
            pointer-events: none;
            color: var(--text);
        }
        .render-status {
            position:absolute;
            left:50%;
            top:1.5vh;
            transform:translateX(-50%);
            z-index:2147483647;
            padding:7px 12px;
            border:1px solid rgba(99,230,190,.35);
            border-radius:7px;
            background:rgba(5,18,33,.92);
            color:#9ff5d2;
            font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
            box-shadow:0 8px 24px rgba(0,0,0,.28);
            pointer-events:none;
        }
        .render-status.error { color:#ff9c9c; border-color:rgba(255,90,90,.5); }

        #top-left { pointer-events:auto; cursor:pointer; }
        #top-left:hover .summary {border-color:#60c3ff;}
        #top-left { top: 1.5vh; left: 1.2vw; width: min(30vw, 460px); }
        #title { font-size: 24px; font-weight: 900; letter-spacing: .4px; text-shadow: 0 2px 9px rgba(0,0,0,.65); }
        #subtitle { margin-top: 2px; color: #a8c0d8; font-size: 12px; letter-spacing: .2px; }

        .summary {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1.05fr repeat(4, .9fr);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: 0 12px 38px rgba(0,0,0,.26);
        }
        .summary .item { min-height: 62px; padding: 9px 10px 8px; border-right: 1px solid rgba(115,170,215,.18); }
        .summary .item:last-child { border-right: 0; }
        .summary .value { font-size: 20px; line-height: 1.05; font-weight: 900; }
        .summary .name { margin-top: 5px; color: #9db6ce; font-size: 10px; }
        .summary .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

        .top-left-hint{margin-top:8px;color:#8bd8f4;font-size:11px;background:#06243baf;display:inline-block;padding:6px 9px;border-radius:6px;}
        .entity-browser{position:fixed;left:1.2vw;top:140px;width:min(520px,95vw);max-height:calc(100vh - 170px);z-index:2147483646;background:#071e33f2;color:#e9f6ff;border:1px solid #4b9cba;border-radius:12px;padding:13px;overflow:auto;box-shadow:0 16px 40px #0008;font:12px/1.5 system-ui,"Microsoft YaHei",sans-serif}
        .entity-browser[hidden]{display:none}.browser-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.browser-head strong{font-size:15px}.browser-head button,.browser-tabs button{background:#173e59;border:1px solid #39708a;border-radius:6px;color:#fff;padding:6px 9px;cursor:pointer}
        .browser-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.browser-tabs button.active{background:#1579a3}.browser-search{width:100%;box-sizing:border-box;background:#102c46;border:1px solid #4a7490;color:white;padding:8px;border-radius:7px}
        .browser-list{margin-top:8px;max-height:48vh;overflow:auto;display:grid;gap:4px}.browser-item{display:flex;justify-content:space-between;gap:10px;text-align:left;background:#0d2e49;border:1px solid #234e69;border-radius:5px;color:#eef9ff;padding:8px;cursor:pointer}.browser-item:hover{background:#215b7b}.browser-item small{color:#9bd9ed}
        #top-right { width:100%; }
        .entity-inspection { position:fixed;right:20px;top:86px;z-index:2147483646;width:min(365px,calc(100vw - 30px));max-height:75vh;overflow:auto;background:rgba(6,22,39,.96);color:#eaf7ff;border:1px solid #5cabc6;border-radius:12px;padding:14px;box-shadow:0 18px 40px #0008;font:12px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
        .entity-inspection[hidden]{display:none}
        .entity-inspection-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
        .entity-inspection-head strong{display:block;font-size:15px}.entity-inspection-head small{display:block;color:#a2c6d9;margin-top:4px}
        .entity-inspection-head button{border:0;background:transparent;color:white;font-size:23px;cursor:pointer}
        .entity-inspection-note{color:#a9c6d6;font-size:11px;line-height:1.5;background:#17405b;padding:8px;border-radius:6px}
        .entity-inspection-rows{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:0}
        .entity-inspection-rows dt{color:#92bbd3;overflow-wrap:anywhere}.entity-inspection-rows dd{margin:0;text-align:right;overflow-wrap:anywhere}
        .entity-inspection-rows em{font-size:10px;color:#84e6c2;font-style:normal}
        .agv-history{border-top:1px solid #42687b;margin-top:12px;padding-top:10px}.agv-history-head{display:flex;align-items:center;justify-content:space-between;gap:5px}.agv-history-head button{background:#185c7f;color:#fff;border:1px solid #4d9bbe;border-radius:5px;padding:5px;cursor:pointer}.agv-history p{color:#a8d1e8;font-size:10px}.agv-history-table{width:100%;border-collapse:collapse;font-size:10px}.agv-history-table th,.agv-history-table td{padding:4px;border-bottom:1px solid #28516a;text-align:left}.agv-history-table th{position:sticky;top:0;background:#08223a}
        .panel-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 38px rgba(0,0,0,.26); backdrop-filter: blur(8px); }
        .legend-box { padding: 12px 13px 11px; }
        .legend-title { font-weight: 800; font-size: 13px; margin-bottom: 8px; }
        .legend-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
        .legend-row { display:flex; align-items:center; gap:7px; color:#cad9e7; font-size:10px; }
        .line-dot { width: 27px; height: 4px; border-radius: 3px; display:inline-block; }
        .side-key { display:grid; grid-template-columns: repeat(2, 1fr); gap:7px; margin-top:9px; padding-top:9px; border-top:1px solid rgba(110,175,220,.16); }
        .side-key div { font-size:10px; color:#c7d7e8; }
        .icon-key { display:inline-flex; width:18px; height:18px; align-items:center; justify-content:center; margin-right:5px; border-radius:4px; background:rgba(37,83,124,.52); color:#fff; }


        #cargo-operations { position:absolute; top:115px; right:18px; z-index:2147483646;
          width:min(350px,35vw); max-height:calc(100vh - 155px); overflow:auto;
          padding:13px; background:rgba(5,18,33,.94); border:1px solid rgba(111,185,245,.48);
          border-radius:12px; color:#eaf5ff; font-size:11px; box-shadow:0 12px 38px rgba(0,0,0,.3); }
        .cargo-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        .cargo-head strong {font-size:14px;} .cargo-head span {font:700 9px monospace; color:#ffcc71;}
        .cargo-statline {color:#8fc5e8; margin-top:9px; line-height:1.5;}
        .cargo-controls {display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:9px;}
        .cargo-controls label {color:#9cb7d1;} .cargo-controls select,.cargo-controls button {
          color:#ecf6ff; background:#18314b; border:1px solid #345474; padding:5px; border-radius:5px; font-size:10px; max-width:150px; }
        .cargo-controls button {cursor:pointer;} .cargo-controls :disabled {opacity:.4;}
        .cargo-selected {margin:11px 0; padding:9px; border:1px solid #345474; border-radius:7px; background:rgba(18,44,69,.7);}
        .cargo-selected strong {font-size:12px;} .cargo-selected div {font-size:9px; color:#a6c0da; margin-top:5px;}
        .cargo-steps {display:grid;grid-template-columns:1fr 1fr;gap:5px;}
        .cargo-step {color:#829bb5;background:rgba(23,42,63,.65);border:1px solid rgba(110,175,220,.14);border-radius:4px;padding:6px;}
        .cargo-step.done {color:#a9eece;border-color:rgba(52,210,142,.25);}
        .cargo-step.current {background:rgba(46,114,90,.45);font-weight:800;}
        .cargo-subtitle {margin-top:12px;font-weight:800;}
        .cargo-events div {border-bottom:1px solid rgba(110,175,220,.12);padding:6px 0;color:#bccee0;font:9px/1.5 monospace;}
        .cargo-error {color:#ffb0b0;margin-top:7px;line-height:1.4;}
        .cargo-note {color:#899fb7;line-height:1.5;font-size:9px;margin-top:10px;}
        @media (max-width:900px) {#cargo-operations {right:8px; width:42vw;top:115px;}}
        #tasks-panel { display:none; }
        .tasks-inner { padding: 13px 14px 11px; }
        .panel-title { font-size: 15px; font-weight: 900; margin-bottom: 9px; }
        .tasks-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:10px; }
        .tasks-table th { color:#8ea8c2; font-weight:600; text-align:left; padding:6px 4px; background:rgba(28,61,93,.40); }
        .tasks-table td { padding:6px 4px; border-top:1px solid rgba(100,160,200,.14); color:#d5e3ef; }
        .status-green { color: var(--green) !important; font-weight:800; }
        .status-blue { color: #57b9ff !important; font-weight:800; }
        .status-orange { color: #ffc14c !important; font-weight:800; }
        .runtime-line { margin-top:8px; color:#88a5bf; font-size:9px; }

        #lifecycle { position:static; width:100%; margin-top:10px; }
        .lifecycle-inner { padding: 12px 17px 13px; }
        .flow { display:flex; align-items:center; justify-content:space-between; gap:7px; }
        .stage { display:flex; align-items:center; gap:7px; min-width:0; }
        .stage-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.28); font-size:14px; flex:0 0 auto; }
        .stage strong { display:block; font-size:11px; }
        .stage span { display:block; color:#9bb3ca; font-size:9px; margin-top:1px; }
        .arrow { color:#76b9ed; font-size:20px; }

        #right-status { display:none; }
        .status-inner { padding: 12px 13px; }
        .status-row { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px solid rgba(100,160,200,.12); font-size:10px; }
        .status-row:last-child { border-bottom:0; }
        .status-row .k { color:#91a9c3; }
        .status-row .v { color:#e3eef8; text-align:right; }



        #disclaimer { left: 1.2vw; top: 14vh; z-index:2147483646; padding:6px 8px; color:#9eb5d0; font-size:clamp(8px,.55vw,10px); border-radius:6px; background:rgba(5,18,33,.55); pointer-events:none; }

        @media (max-width: 900px) {
            #top-left { width: 44vw; }
           
        }
    </style>
    <script src="/config.js"></script>
</head>
<body>
<div id="map_container"></div>

<div id="top-left" class="hud" role="button" tabindex="0" aria-label="展开设备和集装箱详细列表">
    <div id="title">洋山港四期 · 海量空间数据流式渲染</div>
    <div id="subtitle">Yangshan Port Phase IV · Baidu JSAPI WebGL · 155 AGVs · <span id="uiHeartbeat">BOOT</span></div>
    <div class="summary" title="点击打开设备与集装箱列表">
        <div class="item"><div><span class="value" id="agvTotal">155</span> <span style="color:#9db6ce;font-size:9px">辆</span></div><div class="name">AGV 总数</div></div>
        <div class="item"><div><span class="dot" style="background:var(--green)"></span><span class="value" id="agvMoving">0</span></div><div class="name">运行中</div></div>
        <div class="item"><div><span class="dot" style="background:var(--blue)"></span><span class="value" id="agvCharging">0</span></div><div class="name">充电中</div></div>
        <div class="item"><div><span class="dot" style="background:#9aa9bb"></span><span class="value" id="agvParking">155</span></div><div class="name">待机</div></div>
        <div class="item"><div><span class="dot" style="background:#ff3f42"></span><span class="value" id="agvAssigned">0</span></div><div class="name">执行任务</div></div>
    </div>
    <div class="top-left-hint">点击此处查看 AGV / 岸桥 / Gantry / 集装箱的当前信息 ▸</div>
</div>

<section id="cargo-operations" aria-label="进口卸船业务状态"></section>


<a href="/lab.html" id="lab-entry" style="position:fixed;z-index:2147483646;right:20px;bottom:22px;padding:12px 16px;border-radius:9px;text-decoration:none;font-weight:700;color:#eafaff;background:#126996;border:1px solid #4dc5f1;box-shadow:0 8px 22px #0006;">⚙ 空间引擎实验室 · A/B 测试 →</a>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
