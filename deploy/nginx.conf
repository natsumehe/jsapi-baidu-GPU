server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never fall back to index.html for binary/JSON data.
    # This prevents a missing tile from becoming "Invalid PORT tile magic".
    location ^~ /data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        text/css
        text/plain
        image/svg+xml;
}
